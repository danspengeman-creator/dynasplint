<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynasplint Tracker</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a45c40">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2a2420;
    --paper: #faf6f0;
    --card: #ffffff;
    --accent: #a45c40;
    --accent-soft: #e8d9cf;
    --line: #ddd2c6;
    --danger: #b23b3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    padding: 24px 16px 60px;
  }
  @media (max-width: 480px) {
    body { padding: 16px 10px 50px; }
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.8rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: #6b6058;
    margin-bottom: 20px;
    font-size: 0.9rem;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    padding: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 8px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    color: var(--ink);
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    margin: 0 0 14px;
  }
  .goal-hint {
    font-size: 0.82rem;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 0.78rem;
    color: #6b6058;
    margin-bottom: 4px;
    margin-top: 12px;
  }
  input, select, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 0.95rem;
    background: var(--paper);
    color: var(--ink);
  }
  textarea { resize: vertical; min-height: 60px; }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 0.82rem;
    color: var(--ink);
    cursor: pointer;
  }
  .checkbox-label input[type="checkbox"] {
    width: auto;
    margin: 0;
    accent-color: var(--accent);
  }
  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 480px) {
    .row-2 {
      grid-template-columns: 1fr;
    }
    .tabs {
      gap: 6px;
    }
    .tab-btn {
      padding: 14px 8px;
      font-size: 0.95rem;
    }
    input, select, textarea {
      font-size: 16px;
      padding: 11px 10px;
    }
    button.submit {
      padding: 15px;
    }
    #scheduleTable th, #scheduleTable td {
      padding: 8px 8px;
      font-size: 0.78rem;
    }
  }
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  #scheduleTable td, #scheduleTable th {
    white-space: nowrap;
  }
  button.submit {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button.submit:disabled { opacity: 0.6; }
  .status-msg {
    margin-top: 10px;
    font-size: 0.85rem;
  }
  .status-msg.ok { color: #2f7a4f; }
  .status-msg.err { color: var(--danger); }
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .print-btn {
    padding: 8px 14px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    cursor: pointer;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
    min-width: 520px;
  }
  th, td {
    border-bottom: 1px solid var(--line);
    text-align: left;
    padding: 8px 6px;
    vertical-align: top;
  }
  th {
    color: #6b6058;
    font-weight: 500;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge-yes {
    color: var(--danger);
    font-weight: 500;
  }
  .badge-no { color: #6b6058; }
  .daily-total-row {
    background: var(--accent-soft);
  }
  .daily-total-row td {
    border-bottom: 2px solid var(--accent);
  }
  .current-week-row {
    background: var(--accent-soft);
    font-weight: 600;
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .current-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 0.65rem;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.03em;
    margin-left: 4px;
    vertical-align: middle;
  }
  .del-btn {
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 0.78rem;
    text-decoration: underline;
    font-family: 'DM Mono', monospace;
  }
  .empty-state {
    color: #6b6058;
    font-size: 0.85rem;
    padding: 10px 0;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .tabs, .card.entry-form, .print-btn, .del-btn { display: none !important; }
    .card { border: none; padding: 0; }
    h1 { font-size: 1.4rem; }
    table { font-size: 0.8rem; }
    .print-footer { display: block !important; }
  }
  .print-footer {
    display: none;
    margin-top: 30px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 0.78rem;
    color: #6b6058;
  }
</style>
</head>
<body>

<h1>Dynasplint Tracker</h1>
<div class="subtitle" id="mainSubtitle">Daily wear log for elbow flexion and extension</div>

<div class="tabs">
  <button class="tab-btn active" id="tabFlexionBtn" onclick="switchTab('flexion')">Flexion</button>
  <button class="tab-btn" id="tabExtensionBtn" onclick="switchTab('extension')">Extension</button>
</div>

<div class="card entry-form">
  <h2>Log a session</h2>
  <div class="goal-hint" id="goalHint">Goal: 2 hours per day</div>
  <form id="entryForm">
    <label>Date</label>
    <input type="date" id="fDate" required>
    <div class="row-2">
      <div>
        <label>Duration worn (minutes)</label>
        <input type="number" id="fDuration" min="0" required>
        <label class="checkbox-label">
          <input type="checkbox" id="fOvernight" onchange="toggleOvernight()">
          Slept in it overnight
        </label>
      </div>
      <div>
        <label>Tension / increment</label>
        <input type="text" id="fTension" required>
      </div>
    </div>
    <div class="row-2">
      <div>
        <label>Discomfort</label>
        <select id="fDiscomfort" onchange="toggleDiscomfortNotes()">
          <option>No</option>
          <option>Yes</option>
        </select>
      </div>
      <div id="discomfortNotesWrap" style="display:none;">
        <label>Pain level (0-10)</label>
        <select id="fPainLevel">
          <option value="">Select</option>
          <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
        <label>Discomfort notes</label>
        <input type="text" id="fDiscomfortNotes" placeholder="Where, how long, etc.">
      </div>
    </div>
    <label>Comments</label>
    <textarea id="fComments" placeholder="How it went, how you're feeling, anything else"></textarea>
    <button type="submit" class="submit" id="submitBtn">Log Session</button>
    <div id="statusMsg"></div>
  </form>
</div>

<div class="card">
  <h2 style="margin:0 0 4px;">Tension Schedule</h2>
  <div class="goal-hint" style="margin-top:0;">Add one degree per splint at the start of each new week block</div>
  <div class="table-scroll">
    <table id="scheduleTable">
      <thead><tr><th>Week</th><th>Dates</th><th>Flexion Tension</th><th>Extension Tension</th></tr></thead>
      <tbody id="scheduleBody"></tbody>
    </table>
  </div>
</div>

<div class="card">
  <div class="log-header">
    <h2 id="logTitle" style="margin:0;">Flexion Log</h2>
    <button class="print-btn" onclick="window.print()">Print / Save PDF</button>
  </div>
  <div id="logTableWrap">
    <div class="empty-state">Loading...</div>
  </div>
</div>

<div class="print-footer">Patient: Dan Spengeman &nbsp;|&nbsp; DOB: 8-4-1982</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkfryb1yoQ8Vl1tfjiYb4sjODfCnDyEpJSng6-YUNtPXNP0EAyo2n76Dw8NN098rkN/exec';

  let currentSplint = 'flexion';
  let entriesCache = { flexion: [], extension: [] };

  function switchTab(splint) {
    currentSplint = splint;
    document.getElementById('tabFlexionBtn').classList.toggle('active', splint === 'flexion');
    document.getElementById('tabExtensionBtn').classList.toggle('active', splint === 'extension');
    document.getElementById('logTitle').textContent = (splint === 'flexion' ? 'Flexion' : 'Extension') + ' Log';
    document.getElementById('mainSubtitle').textContent = 'Daily wear log for elbow ' + splint;
    document.getElementById('goalHint').textContent = (splint === 'flexion')
      ? 'Goal: 2 hours per day'
      : 'Goal: 4+ hours per day, ideally overnight if tolerated';
    renderLog();
    loadEntries(splint);
  }

  function toggleOvernight() {
    const overnight = document.getElementById('fOvernight').checked;
    const durationInput = document.getElementById('fDuration');
    if (overnight) {
      durationInput.disabled = true;
      durationInput.required = false;
      durationInput.value = '';
    } else {
      durationInput.disabled = false;
      durationInput.required = true;
    }
  }

  function toggleDiscomfortNotes() {
    const val = document.getElementById('fDiscomfort').value;
    document.getElementById('discomfortNotesWrap').style.display = (val === 'Yes') ? 'block' : 'none';
  }

  function loadEntries(splint) {
    document.getElementById('logTableWrap').innerHTML = '<div class="empty-state">Loading...</div>';
    fetch(SCRIPT_URL + '?action=list&splint=' + splint)
      .then(r => r.json())
      .then(data => {
        entriesCache[splint] = data.entries || [];
        if (currentSplint === splint) renderLog();
      })
      .catch(() => {
        document.getElementById('logTableWrap').innerHTML = '<div class="empty-state">Could not load entries. Check the connection.</div>';
      });
  }

  function renderLog() {
    const entries = entriesCache[currentSplint] || [];
    const wrap = document.getElementById('logTableWrap');
    if (entries.length === 0) {
      wrap.innerHTML = '<div class="empty-state">No entries logged yet.</div>';
      return;
    }
    const sorted = entries.slice().sort((a, b) => (a.date + a.session).localeCompare(b.date + b.session));

    let html = '<div class="table-scroll"><table><thead><tr><th>Date</th><th>Duration</th><th>Tension</th><th>Discomfort</th><th>Pain</th><th>Comments</th><th class="del-col"></th></tr></thead><tbody>';

    let currentDate = null;
    let dailyTotal = 0;
    for (let i = 0; i < sorted.length; i++) {
      const e = sorted[i];
      if (currentDate !== null && e.date !== currentDate) {
        html += dailyTotalRow(currentDate, dailyTotal);
        dailyTotal = 0;
      }
      currentDate = e.date;
      dailyTotal += parseFloat(e.duration) || 0;

      const discClass = e.discomfort === 'Yes' ? 'badge-yes' : 'badge-no';
      html += '<tr>' +
        '<td>' + escapeHtml(e.date) + '</td>' +
        '<td>' + escapeHtml(e.duration) + (e.duration === 'Overnight' ? '' : ' min') + '</td>' +
        '<td>' + escapeHtml(e.tension) + '</td>' +
        '<td class="' + discClass + '">' + escapeHtml(e.discomfort) + (e.discomfortNotes ? ' - ' + escapeHtml(e.discomfortNotes) : '') + '</td>' +
        '<td>' + escapeHtml(e.painLevel) + '</td>' +
        '<td>' + escapeHtml(e.comments) + '</td>' +
        '<td class="del-col"><button class="del-btn" onclick="deleteEntry(' + e.rowIndex + ')">delete</button></td>' +
        '</tr>';
    }
    if (currentDate !== null) {
      html += dailyTotalRow(currentDate, dailyTotal);
    }

    html += '</tbody></table></div>';
    wrap.innerHTML = html;
  }

  function dailyTotalRow(date, total) {
    return '<tr class="daily-total-row"><td><strong>' + escapeHtml(date) + ' total</strong></td>' +
      '<td><strong>' + total + ' min</strong></td>' +
      '<td colspan="5"></td></tr>';
  }

  function deleteEntry(rowIndex) {
    if (!confirm('Delete this entry?')) return;
    fetch(SCRIPT_URL + '?action=delete&splint=' + currentSplint + '&rowIndex=' + rowIndex)
      .then(r => r.json())
      .then(() => loadEntries(currentSplint));
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  document.getElementById('entryForm').addEventListener('submit', function(evt) {
    evt.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    submitBtn.disabled = true;
    statusMsg.textContent = '';
    statusMsg.className = 'status-msg';

    const params = new URLSearchParams({
      action: 'add',
      splint: currentSplint,
      date: document.getElementById('fDate').value,
      duration: document.getElementById('fOvernight').checked ? 'Overnight' : document.getElementById('fDuration').value,
      tension: document.getElementById('fTension').value,
      discomfort: document.getElementById('fDiscomfort').value,
      discomfortNotes: document.getElementById('fDiscomfortNotes').value,
      painLevel: document.getElementById('fPainLevel').value,
      comments: document.getElementById('fComments').value
    });

    fetch(SCRIPT_URL + '?' + params.toString())
      .then(r => r.json())
      .then(data => {
        submitBtn.disabled = false;
        if (data.status === 'ok') {
          statusMsg.textContent = 'Session logged.';
          statusMsg.className = 'status-msg ok';
          document.getElementById('entryForm').reset();
          document.getElementById('fDate').valueAsDate = new Date();
          toggleDiscomfortNotes();
          toggleOvernight();
          loadEntries(currentSplint);
        } else {
          statusMsg.textContent = 'Something went wrong. Try again.';
          statusMsg.className = 'status-msg err';
        }
      })
      .catch(() => {
        submitBtn.disabled = false;
        statusMsg.textContent = 'Could not reach the tracker. Check the connection.';
        statusMsg.className = 'status-msg err';
      });
  });

  function buildSchedule() {
    const startDate = new Date(2026, 7, 13); // Aug 13, 2026
    const flexionBase = 4;
    const extensionBase = 2;
    const weeks = 13;
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const body = document.getElementById('scheduleBody');
    let html = '';

    for (let w = 0; w < weeks; w++) {
      const weekStart = new Date(startDate);
      weekStart.setDate(startDate.getDate() + w * 7);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);

      const isCurrent = today >= weekStart && today <= weekEnd;
      const rowClass = isCurrent ? ' class="current-week-row"' : '';
      const weekLabel = (w + 1) + (isCurrent ? ' <span class="current-badge">CURRENT</span>' : '');

      html += '<tr' + rowClass + '>' +
        '<td>' + weekLabel + '</td>' +
        '<td>' + formatShortDate(weekStart) + ' - ' + formatShortDate(weekEnd, weekStart) + '</td>' +
        '<td>' + (flexionBase + w) + '</td>' +
        '<td>' + (extensionBase + w) + '</td>' +
        '</tr>';
    }
    body.innerHTML = html;

    const currentRow = body.querySelector('.current-week-row');
    if (currentRow) {
      currentRow.scrollIntoView({ block: 'nearest' });
    }
  }

  function formatShortDate(d, refDate) {
    const str = (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
    if (refDate && refDate.getFullYear() === d.getFullYear()) {
      return (d.getMonth() + 1) + '/' + d.getDate();
    }
    return str;
  }

  buildSchedule();
  document.getElementById('fDate').valueAsDate = new Date();
  loadEntries('flexion');
  loadEntries('extension');

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    });
  }
</script>

</body>
</html>
